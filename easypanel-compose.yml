name: ${COMPOSE_PROJECT_NAME:?Configure COMPOSE_PROJECT_NAME en EasyPanel}

services:

    mailcow-init:
      build:
        context: .
        dockerfile: easypanel/Dockerfile
      environment:
        - MAILCOW_HOSTNAME=${MAILCOW_HOSTNAME}
      volumes:
        - "${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}:/mailcow-data"
      restart: "no"
      networks:
        - mailcow-network


    unbound-mailcow:
      depends_on:
        mailcow-init:
          condition: service_completed_successfully
      image: ghcr.io/mailcow/unbound:1.26.1-1
      environment:
        - TZ=${TZ}
        - SKIP_UNBOUND_HEALTHCHECK=${SKIP_UNBOUND_HEALTHCHECK:-n}
      volumes:
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/hooks/unbound:/hooks:Z
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/conf/unbound/unbound.conf:/etc/unbound/unbound.conf:ro,Z
      restart: always
      tty: true
      networks:
        mailcow-network:
          ipv4_address: ${IPV4_NETWORK:-172.30.50}.254
          aliases:
            - unbound

    mysql-mailcow:
      image: mariadb:10.11
      depends_on:
        mailcow-init:
          condition: service_completed_successfully
        unbound-mailcow:
          condition: service_started
      stop_grace_period: 45s
      volumes:
        - mysql-vol-1:/var/lib/mysql/
        - mysql-socket-vol-1:/var/run/mysqld/:z
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/conf/mysql/:/etc/mysql/conf.d/:ro,Z
      environment:
        - TZ=${TZ}
        - MYSQL_ROOT_PASSWORD=${DBROOT:?Configure DBROOT}
        - MYSQL_DATABASE=${DBNAME}
        - MYSQL_USER=${DBUSER}
        - MYSQL_PASSWORD=${DBPASS:?Configure DBPASS}
        - MYSQL_INITDB_SKIP_TZINFO=1
      restart: always
      networks:
        mailcow-network:
          aliases:
            - mysql

    redis-mailcow:
      image: redis:7.4.11-alpine
      entrypoint: ["/bin/sh","/redis-conf.sh"]
      volumes:
        - redis-vol-1:/data/
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/conf/redis/redis-conf.sh:/redis-conf.sh:z
      restart: always
      depends_on:
        mailcow-init:
          condition: service_completed_successfully
      environment:
        - TZ=${TZ}
        - REDISPASS=${REDISPASS:?Configure REDISPASS}
        - REDISMASTERPASS=${REDISMASTERPASS:-}
      sysctls:
        - net.core.somaxconn=4096
      networks:
        mailcow-network:
          ipv4_address: ${IPV4_NETWORK:-172.30.50}.249
          aliases:
            - redis

    clamd-mailcow:
      image: ghcr.io/mailcow/clamd:1.4.6-1
      restart: always
      depends_on:
        mailcow-init:
          condition: service_completed_successfully
        unbound-mailcow:
          condition: service_healthy
      dns:
        - ${IPV4_NETWORK:-172.30.50}.254
      environment:
        - TZ=${TZ}
        - SKIP_CLAMD=${SKIP_CLAMD:-n}
      volumes:
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/conf/clamav/:/etc/clamav/:Z
        - clamd-db-vol-1:/var/lib/clamav
      networks:
        mailcow-network:
          aliases:
            - clamd

    rspamd-mailcow:
      image: ghcr.io/mailcow/rspamd:4.2.1-1
      stop_grace_period: 30s
      depends_on:
        mailcow-init:
          condition: service_completed_successfully
        dovecot-mailcow:
          condition: service_started
        clamd-mailcow:
          condition: service_started
      environment:
        - TZ=${TZ}
        - IPV4_NETWORK=${IPV4_NETWORK:-172.30.50}
        - IPV6_NETWORK=${IPV6_NETWORK:-fd4d:6169:6c63:6f77::/64}
        - REDIS_SLAVEOF_IP=${REDIS_SLAVEOF_IP:-}
        - REDIS_SLAVEOF_PORT=${REDIS_SLAVEOF_PORT:-}
        - REDISPASS=${REDISPASS:?Configure REDISPASS}
        - SPAMHAUS_DQS_KEY=${SPAMHAUS_DQS_KEY:-}
      volumes:
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/hooks/rspamd:/hooks:Z
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/conf/rspamd/custom/:/etc/rspamd/custom:z
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/conf/rspamd/override.d/:/etc/rspamd/override.d:Z
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/conf/rspamd/local.d/:/etc/rspamd/local.d:Z
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/conf/rspamd/plugins.d/:/etc/rspamd/plugins.d:Z
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/conf/rspamd/lua/:/etc/rspamd/lua/:ro,Z
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/conf/rspamd/rspamd.conf.local:/etc/rspamd/rspamd.conf.local:Z
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/conf/rspamd/rspamd.conf.override:/etc/rspamd/rspamd.conf.override:Z
        - rspamd-vol-1:/var/lib/rspamd
      restart: always
      hostname: rspamd
      dns:
        - ${IPV4_NETWORK:-172.30.50}.254
      networks:
        mailcow-network:
          aliases:
            - rspamd

    php-fpm-mailcow:
      image: ghcr.io/mailcow/phpfpm:8.2.29-3
      command: "php-fpm -d date.timezone=${TZ} -d expose_php=0"
      depends_on:
        mailcow-init:
          condition: service_completed_successfully
        redis-mailcow:
          condition: service_started
      volumes:
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/hooks/phpfpm:/hooks:Z
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/web:/web:z
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/conf/rspamd/dynmaps:/dynmaps:ro,z
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/conf/rspamd/custom/:/rspamd_custom_maps:z
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/conf/dovecot/auth/mailcowauth.php:/mailcowauth/mailcowauth.php:z
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/web/inc/functions.inc.php:/mailcowauth/functions.inc.php:z
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/web/inc/functions.auth.inc.php:/mailcowauth/functions.auth.inc.php:z
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/web/inc/sessions.inc.php:/mailcowauth/sessions.inc.php:z
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/web/inc/functions.mailbox.inc.php:/mailcowauth/functions.mailbox.inc.php:z
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/web/inc/functions.ratelimit.inc.php:/mailcowauth/functions.ratelimit.inc.php:z
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/web/inc/functions.acl.inc.php:/mailcowauth/functions.acl.inc.php:z
        - rspamd-vol-1:/var/lib/rspamd
        - mysql-socket-vol-1:/var/run/mysqld/:z
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/conf/sogo/:/etc/sogo/:z
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/conf/rspamd/meta_exporter:/meta_exporter:ro,z
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/conf/phpfpm/crons:/crons:z
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/conf/phpfpm/sogo-sso/:/etc/sogo-sso/:z
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/conf/phpfpm/php-fpm.d/pools.conf:/usr/local/etc/php-fpm.d/z-pools.conf:Z
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/conf/phpfpm/php-conf.d/opcache-recommended.ini:/usr/local/etc/php/conf.d/opcache-recommended.ini:Z
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/conf/phpfpm/php-conf.d/upload.ini:/usr/local/etc/php/conf.d/upload.ini:Z
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/conf/phpfpm/php-conf.d/other.ini:/usr/local/etc/php/conf.d/zzz-other.ini:Z
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/conf/dovecot/global_sieve_before:/global_sieve/before:z
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/conf/dovecot/global_sieve_after:/global_sieve/after:z
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/assets/templates:/tpls:z
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/conf/nginx/:/etc/nginx/conf.d/:z
      dns:
        - ${IPV4_NETWORK:-172.30.50}.254
      environment:
        - REDIS_SLAVEOF_IP=${REDIS_SLAVEOF_IP:-}
        - REDIS_SLAVEOF_PORT=${REDIS_SLAVEOF_PORT:-}
        - REDISPASS=${REDISPASS:?Configure REDISPASS}
        - LOG_LINES=${LOG_LINES:-9999}
        - TZ=${TZ}
        - DBNAME=${DBNAME}
        - DBUSER=${DBUSER}
        - DBPASS=${DBPASS:?Configure DBPASS}
        - MAILCOW_HOSTNAME=${MAILCOW_HOSTNAME}
        - MAILCOW_PASS_SCHEME=${MAILCOW_PASS_SCHEME:-BLF-CRYPT}
        - IMAP_PORT=${IMAP_PORT:-143}
        - IMAPS_PORT=${IMAPS_PORT:-993}
        - POP_PORT=${POP_PORT:-110}
        - POPS_PORT=${POPS_PORT:-995}
        - SIEVE_PORT=${SIEVE_PORT:-4190}
        - IPV4_NETWORK=${IPV4_NETWORK:-172.30.50}
        - IPV6_NETWORK=${IPV6_NETWORK:-fd4d:6169:6c63:6f77::/64}
        - SUBMISSION_PORT=${SUBMISSION_PORT:-587}
        - SMTPS_PORT=${SMTPS_PORT:-465}
        - SMTP_PORT=${SMTP_PORT:-25}
        - API_KEY=${API_KEY:-invalid}
        - API_KEY_READ_ONLY=${API_KEY_READ_ONLY:-invalid}
        - API_ALLOW_FROM=${API_ALLOW_FROM:-invalid}
        - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME:-mailcow-dockerized}
        - SKIP_FTS=${SKIP_FTS:-y}
        - SKIP_CLAMD=${SKIP_CLAMD:-n}
        - SKIP_OLEFY=${SKIP_OLEFY:-n}
        - SKIP_SOGO=${SKIP_SOGO:-n}
        - ALLOW_ADMIN_EMAIL_LOGIN=${ALLOW_ADMIN_EMAIL_LOGIN:-n}
        - MASTER=${MASTER:-y}
        - DEV_MODE=${DEV_MODE:-n}
        - DEMO_MODE=${DEMO_MODE:-n}
        - WEBAUTHN_ONLY_TRUSTED_VENDORS=${WEBAUTHN_ONLY_TRUSTED_VENDORS:-n}
        - CLUSTERMODE=${CLUSTERMODE:-}
        - ADDITIONAL_SERVER_NAMES=${ADDITIONAL_SERVER_NAMES:-}
      restart: always
      labels:
        ofelia.enabled: "true"
        ofelia.job-exec.phpfpm_keycloak_sync.schedule: "0 * * * * *"
        ofelia.job-exec.phpfpm_keycloak_sync.no-overlap: "true"
        ofelia.job-exec.phpfpm_keycloak_sync.command: "/bin/bash -c \"php /crons/keycloak-sync.php || exit 0\""
        ofelia.job-exec.phpfpm_ldap_sync.schedule: "0 * * * * *"
        ofelia.job-exec.phpfpm_ldap_sync.no-overlap: "true"
        ofelia.job-exec.phpfpm_ldap_sync.command: "/bin/bash -c \"php /crons/ldap-sync.php || exit 0\""
      networks:
        mailcow-network:
          aliases:
            - phpfpm

    sogo-mailcow:
      depends_on:
        mailcow-init:
          condition: service_completed_successfully
      image: ghcr.io/mailcow/sogo:5.12.11-1
      environment:
        - DBNAME=${DBNAME}
        - DBUSER=${DBUSER}
        - DBPASS=${DBPASS:?Configure DBPASS}
        - TZ=${TZ}
        - LOG_LINES=${LOG_LINES:-9999}
        - MAILCOW_HOSTNAME=${MAILCOW_HOSTNAME}
        - MAILCOW_PASS_SCHEME=${MAILCOW_PASS_SCHEME:-BLF-CRYPT}
        - ACL_ANYONE=${ACL_ANYONE:-disallow}
        - ALLOW_ADMIN_EMAIL_LOGIN=${ALLOW_ADMIN_EMAIL_LOGIN:-n}
        - IPV4_NETWORK=${IPV4_NETWORK:-172.30.50}
        - SOGO_EXPIRE_SESSION=${SOGO_EXPIRE_SESSION:-480}
        - SOGO_URL_ENCRYPTION_KEY=${SOGO_URL_ENCRYPTION_KEY:?Configure SOGO_URL_ENCRYPTION_KEY}
        - SKIP_SOGO=${SKIP_SOGO:-n}
        - MASTER=${MASTER:-y}
        - REDIS_SLAVEOF_IP=${REDIS_SLAVEOF_IP:-}
        - REDIS_SLAVEOF_PORT=${REDIS_SLAVEOF_PORT:-}
        - REDISPASS=${REDISPASS:?Configure REDISPASS}
      dns:
        - ${IPV4_NETWORK:-172.30.50}.254
      volumes:
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/hooks/sogo:/hooks:Z
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/conf/sogo/:/etc/sogo/:z
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/web/inc/init_db.inc.php:/init_db.inc.php:z
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/conf/sogo/custom-favicon.ico:/usr/local/lib/GNUstep/SOGo/WebServerResources/img/sogo.ico:z
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/conf/sogo/custom-shortlogo.svg:/usr/local/lib/GNUstep/SOGo/WebServerResources/img/sogo-compact.svg:z
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/conf/sogo/custom-fulllogo.svg:/usr/local/lib/GNUstep/SOGo/WebServerResources/img/sogo-full.svg:z
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/conf/sogo/custom-fulllogo.png:/usr/local/lib/GNUstep/SOGo/WebServerResources/img/sogo-logo.png:z
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/conf/sogo/custom-theme.js:/usr/local/lib/GNUstep/SOGo/WebServerResources/js/theme.js:z
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/conf/sogo/custom-sogo.js:/usr/local/lib/GNUstep/SOGo/WebServerResources/js/custom-sogo.js:z
        - mysql-socket-vol-1:/var/run/mysqld/:z
        - sogo-web-vol-1:/sogo_web
        - sogo-userdata-backup-vol-1:/sogo_backup
      labels:
        ofelia.enabled: "true"
        ofelia.job-exec.sogo_sessions.schedule: "0 * * * * *"
        ofelia.job-exec.sogo_sessions.command: "/bin/bash -c \"[[ $${MASTER} == y ]] && /usr/local/bin/gosu sogo /usr/sbin/sogo-tool -v expire-sessions $${SOGO_EXPIRE_SESSION} || exit 0\""
        ofelia.job-exec.sogo_ealarms.schedule: "0 * * * * *"
        ofelia.job-exec.sogo_ealarms.command: "/bin/bash -c \"[[ $${MASTER} == y ]] && /usr/local/bin/gosu sogo /usr/sbin/sogo-ealarms-notify -p /etc/sogo/cron.creds || exit 0\""
        ofelia.job-exec.sogo_eautoreply.schedule: "0 */5 * * * *"
        ofelia.job-exec.sogo_eautoreply.command: "/bin/bash -c \"[[ $${MASTER} == y ]] && /usr/local/bin/gosu sogo /usr/sbin/sogo-tool update-autoreply -p /etc/sogo/sieve.creds || exit 0\""
        ofelia.job-exec.sogo_backup.schedule: "0 0 0 * * *"
        ofelia.job-exec.sogo_backup.command: "/bin/bash -c \"[[ $${MASTER} == y ]] && /usr/local/bin/gosu sogo /usr/sbin/sogo-tool backup /sogo_backup ALL || exit 0\""
      restart: always
      networks:
        mailcow-network:
          ipv4_address: ${IPV4_NETWORK:-172.30.50}.248
          aliases:
            - sogo

    dovecot-mailcow:
      image: ghcr.io/mailcow/dovecot:2.3.21.1-2
      depends_on:
        mailcow-init:
          condition: service_completed_successfully
        mysql-mailcow:
          condition: service_started
        redis-mailcow:
          condition: service_started
      dns:
        - ${IPV4_NETWORK:-172.30.50}.254
      cap_add:
        - NET_BIND_SERVICE
      volumes:
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/hooks/dovecot:/hooks:Z
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/conf/dovecot:/etc/dovecot:z
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/assets/ssl:/etc/ssl/mail/:ro,z
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/conf/sogo/:/etc/sogo/:z
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/conf/phpfpm/sogo-sso/:/etc/phpfpm/:z
        - vmail-vol-1:/var/vmail
        - vmail-index-vol-1:/var/vmail_index
        - crypt-vol-1:/mail_crypt/
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/conf/rspamd/custom/:/etc/rspamd/custom:z
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/assets/templates:/templates:z
        - rspamd-vol-1:/var/lib/rspamd
        - mysql-socket-vol-1:/var/run/mysqld/:z
      environment:
        - DOVECOT_MASTER_USER=${DOVECOT_MASTER_USER:-}
        - DOVECOT_MASTER_PASS=${DOVECOT_MASTER_PASS:-}
        - MAILCOW_REPLICA_IP=${MAILCOW_REPLICA_IP:-}
        - DOVEADM_REPLICA_PORT=${DOVEADM_REPLICA_PORT:-}
        - LOG_LINES=${LOG_LINES:-9999}
        - DBNAME=${DBNAME}
        - DBUSER=${DBUSER}
        - DBPASS=${DBPASS:?Configure DBPASS}
        - TZ=${TZ}
        - MAILCOW_HOSTNAME=${MAILCOW_HOSTNAME}
        - MAILCOW_PASS_SCHEME=${MAILCOW_PASS_SCHEME:-BLF-CRYPT}
        - IPV4_NETWORK=${IPV4_NETWORK:-172.30.50}
        - ALLOW_ADMIN_EMAIL_LOGIN=${ALLOW_ADMIN_EMAIL_LOGIN:-n}
        - MAILDIR_GC_TIME=${MAILDIR_GC_TIME:-7200}
        - ACL_ANYONE=${ACL_ANYONE:-disallow}
        - SKIP_FTS=${SKIP_FTS:-y}
        - FTS_HEAP=${FTS_HEAP:-512}
        - FTS_PROCS=${FTS_PROCS:-3}
        - MAILDIR_SUB=${MAILDIR_SUB:-}
        - MASTER=${MASTER:-y}
        - REDIS_SLAVEOF_IP=${REDIS_SLAVEOF_IP:-}
        - REDIS_SLAVEOF_PORT=${REDIS_SLAVEOF_PORT:-}
        - REDISPASS=${REDISPASS:?Configure REDISPASS}
        - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME:-mailcow-dockerized}
      ports:
        - "${IMAPS_PORT:-993}:993"
      restart: always
      tty: true
      labels:
        ofelia.enabled: "true"
        ofelia.job-exec.dovecot_imapsync_runner.schedule: "0 * * * * *"
        ofelia.job-exec.dovecot_imapsync_runner.no-overlap: "true"
        ofelia.job-exec.dovecot_imapsync_runner.command: "/bin/bash -c \"[[ $${MASTER} == y ]] && /usr/local/bin/gosu nobody /usr/local/bin/imapsync_runner.pl || exit 0\""
        ofelia.job-exec.dovecot_trim_logs.schedule: "0 * * * * *"
        ofelia.job-exec.dovecot_trim_logs.command: "/bin/bash -c \"[[ $${MASTER} == y ]] && /usr/local/bin/gosu vmail /usr/local/bin/trim_logs.sh || exit 0\""
        ofelia.job-exec.dovecot_quarantine.schedule: "0 */20 * * * *"
        ofelia.job-exec.dovecot_quarantine.command: "/bin/bash -c \"[[ $${MASTER} == y ]] && /usr/local/bin/gosu vmail /usr/local/bin/quarantine_notify.py || exit 0\""
        ofelia.job-exec.dovecot_clean_q_aged.schedule: "0 0 0 * * *"
        ofelia.job-exec.dovecot_clean_q_aged.command: "/bin/bash -c \"[[ $${MASTER} == y ]] && /usr/local/bin/gosu vmail /usr/local/bin/clean_q_aged.sh || exit 0\""
        ofelia.job-exec.dovecot_maildir_gc.schedule: "0 */30 * * * *"
        ofelia.job-exec.dovecot_maildir_gc.command: "/bin/bash -c \"source /source_env.sh ; /usr/local/bin/gosu vmail /usr/local/bin/maildir_gc.sh\""
        ofelia.job-exec.dovecot_sarules.schedule: "@every 24h"
        ofelia.job-exec.dovecot_sarules.command: "/bin/bash -c \"/usr/local/bin/sa-rules.sh\""
        ofelia.job-exec.dovecot_fts.schedule: "0 0 0 * * *"
        ofelia.job-exec.dovecot_fts.command: "/bin/bash -c \"/usr/local/bin/gosu vmail /usr/local/bin/optimize-fts.sh\""
        ofelia.job-exec.dovecot_repl_health.schedule: "0 */5 * * * *"
        ofelia.job-exec.dovecot_repl_health.command: "/bin/bash -c \"/usr/local/bin/gosu vmail /usr/local/bin/repl_health.sh\""
      ulimits:
        nproc: 65535
        nofile:
          soft: 20000
          hard: 40000
      networks:
        mailcow-network:
          ipv4_address: ${IPV4_NETWORK:-172.30.50}.250
          aliases:
            - dovecot

    postfix-mailcow:
      image: ghcr.io/mailcow/postfix:3.10.12-1
      depends_on:
        mailcow-init:
          condition: service_completed_successfully
        mysql-mailcow:
          condition: service_started
        unbound-mailcow:
          condition: service_healthy
        postfix-tlspol-mailcow:
          condition: service_started
      volumes:
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/hooks/postfix:/hooks:Z
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/conf/postfix:/opt/postfix/conf:z
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/assets/ssl:/etc/ssl/mail/:ro,z
        - postfix-vol-1:/var/spool/postfix
        - crypt-vol-1:/var/lib/zeyple
        - rspamd-vol-1:/var/lib/rspamd
        - mysql-socket-vol-1:/var/run/mysqld/:z
      environment:
        - LOG_LINES=${LOG_LINES:-9999}
        - TZ=${TZ}
        - DBNAME=${DBNAME}
        - DBUSER=${DBUSER}
        - DBPASS=${DBPASS:?Configure DBPASS}
        - REDIS_SLAVEOF_IP=${REDIS_SLAVEOF_IP:-}
        - REDIS_SLAVEOF_PORT=${REDIS_SLAVEOF_PORT:-}
        - REDISPASS=${REDISPASS:?Configure REDISPASS}
        - MAILCOW_HOSTNAME=${MAILCOW_HOSTNAME}
        - SPAMHAUS_DQS_KEY=${SPAMHAUS_DQS_KEY:-}
      cap_add:
        - NET_BIND_SERVICE
      ports:
        - "${SMTP_PORT:-25}:25"
        - "${SMTPS_PORT:-465}:465"
        - "${SUBMISSION_PORT:-587}:587"
      restart: always
      dns:
        - ${IPV4_NETWORK:-172.30.50}.254
      networks:
        mailcow-network:
          ipv4_address: ${IPV4_NETWORK:-172.30.50}.253
          aliases:
            - postfix

    postfix-tlspol-mailcow:
      image: ghcr.io/mailcow/postfix-tlspol:1.14.0
      depends_on:
        mailcow-init:
          condition: service_completed_successfully
        unbound-mailcow:
          condition: service_healthy
      volumes:
        - postfix-tlspol-vol-1:/var/lib/postfix-tlspol
      environment:
        - LOG_LINES=${LOG_LINES:-9999}
        - TZ=${TZ}
        - REDIS_SLAVEOF_IP=${REDIS_SLAVEOF_IP:-}
        - REDIS_SLAVEOF_PORT=${REDIS_SLAVEOF_PORT:-}
        - REDISPASS=${REDISPASS:?Configure REDISPASS}
        - DEV_MODE=${DEV_MODE:-n}
      restart: always
      dns:
        - ${IPV4_NETWORK:-172.30.50}.254
      networks:
        mailcow-network:
          aliases:
            - postfix-tlspol

    memcached-mailcow:
      depends_on:
        mailcow-init:
          condition: service_completed_successfully
      image: memcached:alpine
      restart: always
      environment:
        - TZ=${TZ}
      networks:
        mailcow-network:
          aliases:
            - memcached

    nginx-mailcow:
      depends_on:
        mailcow-init:
          condition: service_completed_successfully
        redis-mailcow:
          condition: service_started
        php-fpm-mailcow:
          condition: service_started
        sogo-mailcow:
          condition: service_started
        rspamd-mailcow:
          condition: service_started
      image: ghcr.io/mailcow/nginx:1.30.4-1
      dns:
        - ${IPV4_NETWORK:-172.30.50}.254
      environment:
        - HTTPS_PORT=8443
        - HTTP_PORT=8080
        - MAILCOW_HOSTNAME=${MAILCOW_HOSTNAME}
        - ADDITIONAL_SERVER_NAMES=${ADDITIONAL_SERVER_NAMES:-}
        - TZ=${TZ}
        - SKIP_SOGO=${SKIP_SOGO:-n}
        - SKIP_RSPAMD=${SKIP_RSPAMD:-n}
        - ENABLE_IPV6=${ENABLE_IPV6:-true}
        - HTTP_REDIRECT=${HTTP_REDIRECT:-n}
        - PHPFPMHOST=${PHPFPMHOST:-}
        - SOGOHOST=${SOGOHOST:-}
        - RSPAMDHOST=${RSPAMDHOST:-}
        - REDISHOST=${REDISHOST:-}
        - IPV4_NETWORK=${IPV4_NETWORK:-172.30.50}
        - NGINX_USE_PROXY_PROTOCOL=${NGINX_USE_PROXY_PROTOCOL:-n}
        - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      volumes:
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/web:/web:ro,z
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/conf/rspamd/dynmaps:/dynmaps:ro,z
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/assets/ssl/:/etc/ssl/mail/:ro,z
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/conf/nginx/:/etc/nginx/conf.d/:z
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/conf/rspamd/meta_exporter:/meta_exporter:ro,z
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/conf/dovecot/auth/mailcowauth.php:/mailcowauth/mailcowauth.php:z
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/web/inc/functions.inc.php:/mailcowauth/functions.inc.php:z
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/web/inc/functions.auth.inc.php:/mailcowauth/functions.auth.inc.php:z
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/web/inc/sessions.inc.php:/mailcowauth/sessions.inc.php:z
        - sogo-web-vol-1:/usr/local/lib/GNUstep/SOGo/
      expose:
        - "8080"
      restart: always
      networks:
        mailcow-network:
          aliases:
            - nginx

    acme-mailcow:
      depends_on:
        mailcow-init:
          condition: service_completed_successfully
        nginx-mailcow:
          condition: service_started
        unbound-mailcow:
          condition: service_healthy
      build:
        context: ./data/Dockerfiles/acme
      dns:
        - ${IPV4_NETWORK:-172.30.50}.254
      environment:
        - LOG_LINES=${LOG_LINES:-9999}
        - ADDITIONAL_SAN=${ADDITIONAL_SAN:-}
        - AUTODISCOVER_SAN=n
        - MAILCOW_HOSTNAME=${MAILCOW_HOSTNAME}
        - DBNAME=${DBNAME}
        - DBUSER=${DBUSER}
        - DBPASS=${DBPASS:?Configure DBPASS}
        - SKIP_LETS_ENCRYPT=${SKIP_LETS_ENCRYPT:-n}
        - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME:-mailcow-dockerized}
        - DIRECTORY_URL=${DIRECTORY_URL:-}
        - ENABLE_SSL_SNI=${ENABLE_SSL_SNI:-n}
        - SKIP_IP_CHECK=${SKIP_IP_CHECK:-n}
        - SKIP_HTTP_VERIFICATION=${SKIP_HTTP_VERIFICATION:-n}
        - ONLY_MAILCOW_HOSTNAME=y
        - LE_STAGING=${LE_STAGING:-n}
        - TZ=${TZ}
        - REDIS_SLAVEOF_IP=${REDIS_SLAVEOF_IP:-}
        - REDIS_SLAVEOF_PORT=${REDIS_SLAVEOF_PORT:-}
        - REDISPASS=${REDISPASS:?Configure REDISPASS}
        - SNAT_TO_SOURCE=${SNAT_TO_SOURCE:-n}
        - SNAT6_TO_SOURCE=${SNAT6_TO_SOURCE:-n}
        - ACME_DNS_CHALLENGE=y
        - ACME_DNS_PROVIDER=dns_vercel
        - ACME_ACCOUNT_EMAIL=${ACME_ACCOUNT_EMAIL:?Configure ACME_ACCOUNT_EMAIL}
        - VERCEL_TOKEN=${VERCEL_TOKEN:?Configure VERCEL_TOKEN en EasyPanel}
      volumes:
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/web/.well-known/acme-challenge:/var/www/acme:z
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/assets/ssl:/var/lib/acme/:z
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/assets/ssl-example:/var/lib/ssl-example/:ro,Z
        - mysql-socket-vol-1:/var/run/mysqld/:z
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/conf/acme:/etc/acme/:z
      restart: always
      networks:
        mailcow-network:
          aliases:
            - acme

    netfilter-mailcow:
      profiles:
        - netfilter
      depends_on:
        mailcow-init:
          condition: service_completed_successfully
      image: ghcr.io/mailcow/netfilter:1.64
      stop_grace_period: 30s
      restart: always
      privileged: true
      environment:
        - TZ=${TZ}
        - IPV4_NETWORK=${IPV4_NETWORK:-172.30.50}
        - IPV6_NETWORK=${IPV6_NETWORK:-fd4d:6169:6c63:6f77::/64}
        - SNAT_TO_SOURCE=${SNAT_TO_SOURCE:-n}
        - SNAT6_TO_SOURCE=${SNAT6_TO_SOURCE:-n}
        - REDIS_SLAVEOF_IP=${REDIS_SLAVEOF_IP:-}
        - REDIS_SLAVEOF_PORT=${REDIS_SLAVEOF_PORT:-}
        - REDISPASS=${REDISPASS:?Configure REDISPASS}
        - MAILCOW_REPLICA_IP=${MAILCOW_REPLICA_IP:-}
        - DISABLE_NETFILTER_ISOLATION_RULE=${DISABLE_NETFILTER_ISOLATION_RULE:-y}
      network_mode: "host"
      volumes:
        - /lib/modules:/lib/modules:ro

    watchdog-mailcow:
      image: ghcr.io/mailcow/watchdog:2.11
      dns:
        - ${IPV4_NETWORK:-172.30.50}.254
      tmpfs:
        - /tmp
      volumes:
        - rspamd-vol-1:/var/lib/rspamd
        - mysql-socket-vol-1:/var/run/mysqld/:z
        - postfix-vol-1:/var/spool/postfix
        - ${MAILCOW_DATA_PATH:-/opt/mailcow-easypanel-data}/assets/ssl:/etc/ssl/mail/:ro,z
      restart: always
      depends_on:
        mailcow-init:
          condition: service_completed_successfully
        postfix-mailcow:
          condition: service_started
        dovecot-mailcow:
          condition: service_started
        mysql-mailcow:
          condition: service_started
        acme-mailcow:
          condition: service_started
        redis-mailcow:
          condition: service_started
      environment:
        - IPV6_NETWORK=${IPV6_NETWORK:-fd4d:6169:6c63:6f77::/64}
        - LOG_LINES=${LOG_LINES:-9999}
        - TZ=${TZ}
        - DBNAME=${DBNAME}
        - DBUSER=${DBUSER}
        - DBPASS=${DBPASS:?Configure DBPASS}
        - DBROOT=${DBROOT:?Configure DBROOT}
        - USE_WATCHDOG=${USE_WATCHDOG:-n}
        - WATCHDOG_NOTIFY_EMAIL=${WATCHDOG_NOTIFY_EMAIL:-}
        - WATCHDOG_NOTIFY_BAN=${WATCHDOG_NOTIFY_BAN:-y}
        - WATCHDOG_NOTIFY_START=${WATCHDOG_NOTIFY_START:-y}
        - WATCHDOG_SUBJECT=${WATCHDOG_SUBJECT:-Watchdog ALERT}
        - WATCHDOG_NOTIFY_WEBHOOK=${WATCHDOG_NOTIFY_WEBHOOK:-}
        - WATCHDOG_NOTIFY_WEBHOOK_BODY=${WATCHDOG_NOTIFY_WEBHOOK_BODY:-}
        - WATCHDOG_EXTERNAL_CHECKS=${WATCHDOG_EXTERNAL_CHECKS:-n}
        - WATCHDOG_MYSQL_REPLICATION_CHECKS=${WATCHDOG_MYSQL_REPLICATION_CHECKS:-n}
        - WATCHDOG_VERBOSE=${WATCHDOG_VERBOSE:-n}
        - MAILCOW_HOSTNAME=${MAILCOW_HOSTNAME}
        - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME:-mailcow-dockerized}
        - IPV4_NETWORK=${IPV4_NETWORK:-172.30.50}
        - IP_BY_DOCKER_API=${IP_BY_DOCKER_API:-0}
        - CHECK_UNBOUND=${CHECK_UNBOUND:-1}
        - SKIP_CLAMD=${SKIP_CLAMD:-n}
        - SKIP_OLEFY=${SKIP_OLEFY:-n}
        - SKIP_LETS_ENCRYPT=${SKIP_LETS_ENCRYPT:-n}
        - SKIP_SOGO=${SKIP_SOGO:-n}
        - HTTPS_PORT=8443
        - REDIS_SLAVEOF_IP=${REDIS_SLAVEOF_IP:-}
        - REDIS_SLAVEOF_PORT=${REDIS_SLAVEOF_PORT:-}
        - REDISPASS=${REDISPASS:?Configure REDISPASS}
        - EXTERNAL_CHECKS_THRESHOLD=${EXTERNAL_CHECKS_THRESHOLD:-1}
        - NGINX_THRESHOLD=${NGINX_THRESHOLD:-5}
        - UNBOUND_THRESHOLD=${UNBOUND_THRESHOLD:-5}
        - REDIS_THRESHOLD=${REDIS_THRESHOLD:-5}
        - MYSQL_THRESHOLD=${MYSQL_THRESHOLD:-5}
        - MYSQL_REPLICATION_THRESHOLD=${MYSQL_REPLICATION_THRESHOLD:-1}
        - SOGO_THRESHOLD=${SOGO_THRESHOLD:-3}
        - POSTFIX_THRESHOLD=${POSTFIX_THRESHOLD:-8}
        - POSTFIX_TLSPOL_THRESHOLD=${POSTFIX_TLSPOL_THRESHOLD:-8}
        - CLAMD_THRESHOLD=${CLAMD_THRESHOLD:-15}
        - DOVECOT_THRESHOLD=${DOVECOT_THRESHOLD:-12}
        - DOVECOT_REPL_THRESHOLD=${DOVECOT_REPL_THRESHOLD:-20}
        - PHPFPM_THRESHOLD=${PHPFPM_THRESHOLD:-5}
        - RATELIMIT_THRESHOLD=${RATELIMIT_THRESHOLD:-1}
        - FAIL2BAN_THRESHOLD=${FAIL2BAN_THRESHOLD:-1}
        - ACME_THRESHOLD=${ACME_THRESHOLD:-1}
        - RSPAMD_THRESHOLD=${RSPAMD_THRESHOLD:-5}
        - OLEFY_THRESHOLD=${OLEFY_THRESHOLD:-5}
        - MAILQ_THRESHOLD=${MAILQ_THRESHOLD:-20}
        - MAILQ_CRIT=${MAILQ_CRIT:-30}
        - DEV_MODE=${DEV_MODE:-n}
      networks:
        mailcow-network:
          aliases:
            - watchdog

    dockerapi-mailcow:
      depends_on:
        mailcow-init:
          condition: service_completed_successfully
      image: ghcr.io/mailcow/dockerapi:2.12
      security_opt:
        - label=disable
      restart: always
      dns:
        - ${IPV4_NETWORK:-172.30.50}.254
      environment:
        - DBROOT=${DBROOT:?Configure DBROOT}
        - TZ=${TZ}
        - REDIS_SLAVEOF_IP=${REDIS_SLAVEOF_IP:-}
        - REDIS_SLAVEOF_PORT=${REDIS_SLAVEOF_PORT:-}
        - REDISPASS=${REDISPASS:?Configure REDISPASS}
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock:ro
      networks:
        mailcow-network:
          aliases:
            - dockerapi

    olefy-mailcow:
      depends_on:
        mailcow-init:
          condition: service_completed_successfully
      image: ghcr.io/mailcow/olefy:1.15
      restart: always
      environment:
        - TZ=${TZ}
        - OLEFY_BINDADDRESS=0.0.0.0
        - OLEFY_BINDPORT=10055
        - OLEFY_TMPDIR=/tmp
        - OLEFY_PYTHON_PATH=/usr/bin/python3
        - OLEFY_OLEVBA_PATH=/usr/bin/olevba
        - OLEFY_LOGLVL=20
        - OLEFY_MINLENGTH=500
        - OLEFY_DEL_TMP=1
        - SKIP_OLEFY=${SKIP_OLEFY:-n}
      networks:
        mailcow-network:
          aliases:
            - olefy

    ofelia-mailcow:
      image: mcuadros/ofelia:0.3.22
      restart: always
      command: daemon --docker -f label=com.docker.compose.project=${COMPOSE_PROJECT_NAME}
      environment:
        - TZ=${TZ}
        - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME}
      depends_on:
        mailcow-init:
          condition: service_completed_successfully
        sogo-mailcow:
          condition: service_started
        dovecot-mailcow:
          condition: service_started
      labels:
        ofelia.enabled: "true"
      security_opt:
        - label=disable
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock:ro
      networks:
        mailcow-network:
          aliases:
            - ofelia

networks:
  mailcow-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-mailcow
    enable_ipv6: false
    ipam:
      driver: default
      config:
        - subnet: ${IPV4_NETWORK:-172.30.50}.0/24

volumes:
  vmail-vol-1:
  vmail-index-vol-1:
  mysql-vol-1:
  mysql-socket-vol-1:
  redis-vol-1:
  rspamd-vol-1:
  postfix-vol-1:
  postfix-tlspol-vol-1:
  crypt-vol-1:
  sogo-web-vol-1:
  sogo-userdata-backup-vol-1:
  clamd-db-vol-1:
